<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Pulse - Bluetooth Speaker Promotional Page</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet"/>
  </head>
  <body>
    <header class="nav" id="nav">
      <a class="nav-logo" href="#home">Pulse</a> <!-- tentative bluetooth name -->
      <nav>
        <ul class="navigation-links" id="nav-links">
          <li><a href="#home">Home</a></li>
          <li><a href="#explore">Explore</a></li>
          <li><a href="#explore">View in AR</a></li>
          <li><a class="nav-cta" href="#explore">Pre-order</a></li>
        </ul>
      </nav>
      <button class="navigation-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links"></button>
    </header>

    <main>
      <section class="hero" id="home">
        <div class="hero-content">
          <h1 class="hero-title">Pulse</h1>
          <p class="hero-text">Feel every beat. Big, room-filling sound in a speaker you can take anywhere.</p>
          <a class="btn" href="#explore">Explore Pulse</a>
        </div>
      </section>

      <section class="explore" id="explore">
        <h2 class="explore-title">Explore Pulse</h2>

        <div class="viewer">
          <!-- <model-viewer> HTML element -->
          <model-viewer src="model/bluetooth-speaker-final.glb" alt="Pulse Bluetooth speaker" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" shadow-intensity="1.45" exposure="0.84" shadow-softness="0.81" auto-rotate camera-orbit="471.8deg 74.21deg 17.97m" field-of-view="30deg">
            <button class="Hotspot" slot="hotspot-1" data-info="controls" data-position="-0.28226168934140894m 1.067193840291845m 1.7309188415250014m" data-normal="0.7142358883702751m 0.6774991531809514m -0.17567581849252328m" data-visibility-attribute="visible">
              <div class="HotspotAnnotation">Play/Pause Button</div>
            </button>
            <button class="Hotspot" slot="hotspot-2" data-info="sound" data-position="-2.840896730660461m -1.5172793306327363m 1.6553160022566362m" data-normal="-1m 7.669523610901707e-17m 2.6251662125932885e-24m" data-visibility-attribute="visible">
              <div class="HotspotAnnotation">Speaker</div>
            </button>
            <button class="Hotspot" slot="hotspot-3" data-info="pads" data-position="1.8516183525573333m -2.766753619505727m -4.760352175348304m" data-normal="0.7438237087238264m 0.3188499754509755m -0.5874189165282684m" data-visibility-attribute="visible">
              <div class="HotspotAnnotation">Silicone Strap</div>
            </button>
            <button class="Hotspot" slot="hotspot-4" data-info="usbc" data-position="-0.3609559035479446m -0.7298397623973587m 5.303856117156666m" data-normal="-0.9994149126363834m -1.1707135907684792e-9m 0.034202812749979716m" data-visibility-attribute="visible">
              <div class="HotspotAnnotation">USB-C Port</div>
            </button>

            <div class="progress-bar" slot="progress-bar">
              <span class="loader-logo">Pulse</span>
              <div class="loader-track"><div class="update-bar"></div></div>
            </div>
            <button slot="ar-button" id="ar-button">View in your space</button>
          </model-viewer>

          <div class="info" id="info">
            <img class="info-icon" id="info-img" src="images/hotspot.svg" alt="the letter x that is mor circular">
            <div>
              <h3 class="information-title" id="info-title"></h3>
              <p class="info__text" id="info-text"></p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
