<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Bluetooth Speaker Website</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/grid.css" rel="stylesheet"/>
    <link href="css/main.css" rel="stylesheet"/>
  </head>
  <body>
    <div class="grid-con center-grid-con">
      <section class="col-span-full">
        <body>
    <!-- <model-viewer> HTML element -->
    <model-viewer src="bluetooth-speaker-final.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1.45" exposure="0.84" shadow-softness="0.81" auto-rotate camera-orbit="471.8deg 74.21deg 17.97m" field-of-view="30deg">
      <button class="Hotspot" slot="hotspot-1" data-position="-0.28226168934140894m 1.067193840291845m 1.7309188415250014m" data-normal="0.7142358883702751m 0.6774991531809514m -0.17567581849252328m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Play/Pause Button</div>
      </button><button class="Hotspot" slot="hotspot-7" data-position="-2.840896730660461m -1.5172793306327363m 1.6553160022566362m" data-normal="-1m 7.669523610901707e-17m 2.6251662125932885e-24m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Speakee</div>
      </button><button class="Hotspot" slot="hotspot-9" data-position="1.8516183525573333m -2.766753619505727m -4.760352175348304m" data-normal="0.7438237087238264m 0.3188499754509755m -0.5874189165282684m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Silicon Strap</div>
      </button><button class="Hotspot" slot="hotspot-10" data-position="-0.3609559035479446m -0.7298397623973587m 5.303856117156666m" data-normal="-0.9994149126363834m -1.1707135907684792e-9m 0.034202812749979716m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">USB-C Port</div>
      </button>
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>
    </model-viewer>
    </section> 
    </div>

    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
  </body>
</html>
